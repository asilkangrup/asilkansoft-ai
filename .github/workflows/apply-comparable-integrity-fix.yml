name: Apply Comparable Integrity Fix

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/comparable-integrity-normalization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch comparable integrity semantics
        shell: python
        run: |
          from pathlib import Path

          guard_path = Path('app/Services/RealEstateValuationResearchOutputGuardService.php')
          g = guard_path.read_text()
          g = g.replace(
              "            'market_max' => $this->positiveNumber($valuation['market_max'] ?? null),\n            'quick_sale_min' => $this->positiveNumber($valuation['quick_sale_min'] ?? null),",
              "            'market_max' => $this->positiveNumber($valuation['market_max'] ?? null),\n            'realistic_sale_min' => $this->positiveNumber($valuation['realistic_sale_min'] ?? null),\n            'realistic_sale_max' => $this->positiveNumber($valuation['realistic_sale_max'] ?? null),\n            'quick_sale_min' => $this->positiveNumber($valuation['quick_sale_min'] ?? null),",
              1,
          )
          start = g.index('    private function comparablePropertyType(')
          end = g.index('    private function profileLocation(', start)
          replacement = '''    private function comparablePropertyType(mixed $value, array $profileData): ?string
          {
              $expected = $this->safeProfileLabel($profileData['property_type'] ?? null, 48);

              if ($expected === null || ! is_scalar($value)) {
                  return null;
              }

              $actual = $this->normalizeText((string) $value);
              $expectedNormalized = $this->normalizeText($expected);

              if ($actual === $expectedNormalized) {
                  return $expected;
              }

              // Web sources often describe the same category with qualifiers
              // such as "konut imarlı arsa" or "satılık arsa". Preserve only
              // the trusted profile category when it appears as a whole token;
              // unrelated categories still fail closed as mismatch.
              if ($actual !== '' && $expectedNormalized !== '') {
                  $pattern = '/(^|\\s)'.preg_quote($expectedNormalized, '/').'(\\s|$)/u';

                  if (preg_match($pattern, $actual) === 1) {
                      return $expected;
                  }
              }

              return 'mismatch';
          }

          '''
          g = g[:start] + replacement + g[end:]
          guard_path.write_text(g)

          valuation_path = Path('app/Services/RealEstateValuationService.php')
          v = valuation_path.read_text()
          v = v.replace(
              "        $pendingResearchAction = $this->pendingResearchAction($profile, $conversation);\n        $sellerAutoReady = $profile->profile_type === 'seller'",
              "        $pendingResearchAction = $this->pendingResearchAction($profile, $conversation);\n        $repairComparableIntegrity = trim((string) data_get(\n            $data,\n            'next_best_action_intelligence.action_code',\n            ''\n        )) === 'repair_comparable_integrity';\n        $sellerAutoReady = $profile->profile_type === 'seller'",
              1,
          )
          v = v.replace(
              "            ($freshness['usable_for_decision'] ?? false)\n            && ! $forceRefresh\n        ) {",
              "            ($freshness['usable_for_decision'] ?? false)\n            && ! $forceRefresh\n            && ! $repairComparableIntegrity\n        ) {",
              1,
          )
          v = v.replace(
              "- comparables alanına yalnızca gerçekten web araştırmasında gördüğün emsalleri ekle. URL, fiyat veya m² uydurma.",
              "- comparables alanına yalnızca gerçekten web araştırmasında gördüğün emsalleri ekle. URL, fiyat veya m² uydurma.\n- Bir emsal hedef taşınmazla aynı ana kategorideyse comparable.property_type alanını property_profile.property_type ile aynı ana kategori adıyla yaz (ör. hedef 'arsa' ise konut imarlı/satılık arsa kaynağı için 'arsa'). Farklı kategoriyi hedef kategoriye çevirmeye çalışma.",
              1,
          )
          valuation_path.write_text(v)

          test_path = Path('tests/Feature/RealEstateValuationResearchOutputGuardTest.php')
          t = test_path.read_text()
          t = t.replace(
              "                'market_max' => 4_500_000,\n                'quick_sale_min' => 3_200_000,",
              "                'market_max' => 4_500_000,\n                'realistic_sale_min' => 3_850_000,\n                'realistic_sale_max' => 4_150_000,\n                'quick_sale_min' => 3_200_000,",
              1,
          )
          t = t.replace(
              "                        'property_type' => 'arsa',\n                    ],\n                    [",
              "                        'property_type' => 'Konut imarlı arsa',\n                    ],\n                    [",
              1,
          )
          t = t.replace(
              "        $this->assertSame(4_500_000.0, $sanitized['market_max']);\n        $this->assertSame(100, $sanitized['confidence_score']);",
              "        $this->assertSame(4_500_000.0, $sanitized['market_max']);\n        $this->assertSame(3_850_000.0, $sanitized['realistic_sale_min']);\n        $this->assertSame(4_150_000.0, $sanitized['realistic_sale_max']);\n        $this->assertSame(100, $sanitized['confidence_score']);",
              1,
          )
          test_path.write_text(t)

          Path('tests/Feature/RealEstateComparableIntegrityNormalizationTest.php').write_text(r'''<?php
          namespace Tests\Feature;

          use App\Models\AiBot;
          use App\Models\ConversationControl;
          use App\Models\Organization;
          use App\Models\RealEstateProfile;
          use App\Models\User;
          use App\Services\RealEstateComparableIntegrityService;
          use App\Services\RealEstateValuationResearchOutputGuardService;
          use Illuminate\Foundation\Testing\RefreshDatabase;
          use Illuminate\Support\Facades\Hash;
          use Tests\TestCase;

          class RealEstateComparableIntegrityNormalizationTest extends TestCase
          {
              use RefreshDatabase;

              public function test_qualified_arsa_labels_survive_guard_and_become_integrity_usable(): void
              {
                  $profile = $this->seedProfile();
                  $valuation = app(RealEstateValuationResearchOutputGuardService::class)->buildSanitizedValuation([
                      'market_min'=>4200000,'market_max'=>5250000,
                      'realistic_sale_min'=>3900000,'realistic_sale_max'=>4650000,
                      'quick_sale_min'=>3450000,'quick_sale_max'=>3950000,
                      'investor_buy_min'=>3000000,'investor_buy_max'=>3600000,
                      'confidence_score'=>74,
                      'sources'=>['https://one.example/a','https://two.example/b','https://three.example/c'],
                      'comparables'=>[
                          ['url'=>'https://one.example/a','listing_price'=>4250000,'area_sqm'=>400,'location'=>'İstanbul Silivri Büyükçavuşlu','property_type'=>'Konut imarlı arsa'],
                          ['url'=>'https://two.example/b','listing_price'=>4700000,'area_sqm'=>410,'location'=>'İstanbul Silivri Büyükçavuşlu','property_type'=>'Satılık arsa'],
                          ['url'=>'https://three.example/c','listing_price'=>5000000,'area_sqm'=>430,'location'=>'İstanbul Silivri Büyükçavuşlu','property_type'=>'arsa'],
                      ],
                  ], $profile->data);

                  $profile->forceFill(['valuation'=>$valuation])->saveQuietly();
                  $profile->refresh();
                  $integrity = app(RealEstateComparableIntegrityService::class)->assess($profile);

                  $this->assertSame('arsa', $valuation['comparables'][0]['property_type']);
                  $this->assertSame('arsa', $valuation['comparables'][1]['property_type']);
                  $this->assertSame(3_900_000.0, $valuation['realistic_sale_min']);
                  $this->assertSame(4_650_000.0, $valuation['realistic_sale_max']);
                  $this->assertSame(3, $integrity['usable_comparable_count']);
                  $this->assertTrue($integrity['sufficient_for_decision']);
                  $this->assertTrue($integrity['sufficient_for_matching']);
                  $this->assertNull($profile->conversation()->first()->next_follow_up_at);
              }

              public function test_unrelated_property_type_still_fails_closed(): void
              {
                  $profile = $this->seedProfile();
                  $valuation = app(RealEstateValuationResearchOutputGuardService::class)->buildSanitizedValuation([
                      'comparables'=>[[
                          'url'=>'https://one.example/a','listing_price'=>4250000,'area_sqm'=>400,
                          'location'=>'İstanbul Silivri Büyükçavuşlu','property_type'=>'daire',
                      ]],
                  ], $profile->data);
                  $this->assertSame('mismatch', $valuation['comparables'][0]['property_type']);
              }

              private function seedProfile(): RealEstateProfile
              {
                  User::query()->forceCreate(['id'=>40,'name'=>'Emlak AI','email'=>'integrity-normalization@example.test','password'=>Hash::make('test')]);
                  Organization::query()->forceCreate(['id'=>37,'owner_user_id'=>40,'name'=>'Emlak AI','slug'=>'integrity-normalization','status'=>'active']);
                  $bot=AiBot::query()->forceCreate(['id'=>35,'user_id'=>40,'name'=>'Emlak AI','company_name'=>'Asilkan Gayrimenkul','openai_model'=>'gpt-5-mini','status'=>'active','business_sector'=>'real_estate','lead_scoring_profile'=>'real_estate','whatsapp_instance'=>'emlak-ai-35','follow_up_enabled'=>false,'second_follow_up_enabled'=>false,'ai_enabled'=>true]);
                  $conversation=ConversationControl::query()->create(['user_id'=>40,'organization_id'=>37,'ai_bot_id'=>$bot->id,'session_id'=>'integrity-normalization','whatsapp_number'=>'905550000035','tags'=>['business:real_estate_seller'],'lead_status'=>'new','next_follow_up_at'=>null]);
                  return RealEstateProfile::query()->create(['conversation_control_id'=>$conversation->id,'user_id'=>40,'ai_bot_id'=>35,'profile_type'=>'seller','data'=>['property_type'=>'arsa','city'=>'İstanbul','district'=>'Silivri','neighborhood'=>'Büyükçavuşlu','area_sqm'=>400.01,'asking_price'=>4300000],'valuation'=>[],'completeness_score'=>90,'confidence_score'=>80]);
              }
          }
          ''')

          Path('.github/workflows/apply-comparable-integrity-fix.yml').unlink()
      - name: Syntax check
        run: |
          php -l app/Services/RealEstateValuationResearchOutputGuardService.php
          php -l app/Services/RealEstateValuationService.php
          php -l tests/Feature/RealEstateValuationResearchOutputGuardTest.php
          php -l tests/Feature/RealEstateComparableIntegrityNormalizationTest.php
      - name: Commit
        run: |
          git config user.name asilkangrup
          git config user.email asilkangrup@gmail.com
          git add -A
          git commit -m "Normalize researched comparable categories"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
