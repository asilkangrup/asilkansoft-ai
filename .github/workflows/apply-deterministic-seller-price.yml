name: Apply Deterministic Seller Price Reply

on:
  push:
    branches:
      - fix/deterministic-seller-price-reply

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deterministic-seller-price-reply
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/apply_deterministic_seller_price.py
      - name: Validate PHP
        run: |
          php -l app/Services/RealEstateWhatsAppInboundService.php
          php -l app/Services/RealEstateOutboundDeliveryService.php
      - name: Commit patch
        run: |
          git config user.name "asilkangrup"
          git config user.email "asilkangrup@gmail.com"
          git add -A
          git commit -m "Make seller price replies deterministic and plain text"
          git push origin fix/deterministic-seller-price-reply
