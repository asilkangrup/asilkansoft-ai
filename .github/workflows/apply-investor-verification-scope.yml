name: Apply Investor Verification Scope Fix

on:
  push:
    branches:
      - fix/investor-verification-scope

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/investor-verification-scope
      - name: Apply seller-only verification scope
        run: python3 .github/scripts/apply-investor-verification-scope.py
      - name: Syntax check
        run: |
          php -l app/Services/RealEstateVerificationService.php
          php -l app/Services/RealEstateOperatorAlertService.php
          php -l tests/Feature/RealEstateVerificationRiskTest.php
      - name: Persist patch and remove temporary helpers
        run: |
          rm .github/workflows/apply-investor-verification-scope.yml
          rm .github/scripts/apply-investor-verification-scope.py
          git config user.name "asilkangrup"
          git config user.email "asilkangrup@gmail.com"
          git add app/Services/RealEstateVerificationService.php app/Services/RealEstateOperatorAlertService.php tests/Feature/RealEstateVerificationRiskTest.php .github/workflows/apply-investor-verification-scope.yml .github/scripts/apply-investor-verification-scope.py
          git commit -m "Scope property verification to seller profiles"
          git push origin HEAD:fix/investor-verification-scope
