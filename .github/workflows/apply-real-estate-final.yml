name: Apply Real Estate Final Patch

on:
  push:
    branches:
      - fix/real-estate-media-batch-final

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/real-estate-media-batch-final
          fetch-depth: 0

      - name: Apply focused isolated real-estate changes
        run: |
          python3 <<'PY'
          from pathlib import Path

          # 1) Investor qualification: stop interrogating after core criteria;
          #    accept Turkey-wide/flexible geography and keep optional details optional.
          p = Path('app/Services/RealEstateDecisionService.php')
          s = p.read_text()
          old = """    private function investorDecision(array $data, array $valuation): array
              {
                  $missing = $this->missing($data, [
                      'city', 'property_type', 'budget_max', 'investment_goal', 'timeline',
                  ]);
          """
          new = """    private function investorDecision(array $data, array $valuation): array
              {
                  $nationwide = ($data['location_flexibility'] ?? null) === 'flexible';
                  $geographyReady = $this->has($data, 'city') || $nationwide;
                  $missing = $this->missing($data, [
                      'property_type', 'budget_max', 'investment_goal',
                  ]);
                  if (! $geographyReady) {
                      $missing[] = 'geography';
                  }
          """
          if old not in s:
              raise SystemExit('investor decision header not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              "$score += $this->has($data, 'city') ? 10 : 0;\n        $score += ($this->has($data, 'district') || $this->has($data, 'neighborhood')) ? 8 : 0;",
              "$score += $geographyReady ? 10 : 0;\n        $score += ($this->has($data, 'district') || $this->has($data, 'neighborhood')) ? 8 : 0;",
              1,
          )
          old = """        $readyForMatch = $score >= 68
                      && $this->has($data, 'budget_max')
                      && $this->has($data, 'city')
                      && $this->has($data, 'property_type');
          """
          new = """        $readyForMatch = $score >= 58
                      && $this->has($data, 'budget_max')
                      && $geographyReady
                      && $this->has($data, 'property_type')
                      && $this->has($data, 'investment_goal');
          """
          if old not in s:
              raise SystemExit('readyForMatch block not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              ": 'Teklif konuşmadan önce bütçe, hedef bölge, taşınmaz türü ve zamanlamayı tamamla.';",
              ": 'Temel kriterleri tamamla; somut fırsat kararını etkilemeyen ayrıntılarla müşteriyi yorma.';",
              1,
          )
          old = """        $next = match (true) {
                      ! $this->has($data, 'budget_max') => 'Yatırımcının gerçekçi maksimum bütçesini netleştir.',
                      ! $this->has($data, 'city') => 'Hedef il/bölgeyi netleştir.',
                      ! $this->has($data, 'property_type') => 'Aradığı taşınmaz türünü netleştir.',
                      ! $this->has($data, 'investment_goal') => 'Kısa vadeli al-sat, kira getirisi veya değer artışı hedefini sor.',
                      ! $this->has($data, 'timeline') => 'Alım zamanlamasını netleştir.',
                      ! $readyForMatch => 'Finansman ve risk tercihindeki eksikleri tamamla.',
                      default => 'Kriterlere uyan portföyleri iskonto, risk ve veri güveniyle sıralayıp en güçlü fırsatı sun.',
                  };
          """
          new = """        $next = match (true) {
                      ! $this->has($data, 'budget_max') => 'Yatırımcının yaklaşık maksimum bütçesini netleştir.',
                      ! $geographyReady => 'Belirli bir bölge mi aradığını, yoksa Türkiye genelinde fırsata açık mı olduğunu sor.',
                      ! $this->has($data, 'property_type') => 'Öncelikli taşınmaz türünü netleştir.',
                      ! $this->has($data, 'investment_goal') => 'Kısa vadeli al-sat, kira getirisi veya değer artışı hedefini sor.',
                      ! $readyForMatch => 'Mevcut temel kriterlerle fırsat taramasına geç; yalnız somut bir portföy kararını etkiliyorsa ek kriter sor.',
                      default => 'Kriterlere uyan portföyleri iskonto, risk ve veri güveniyle sıralayıp en güçlü fırsatı sun.',
                  };
          """
          if old not in s:
              raise SystemExit('investor next block not found')
          s = s.replace(old, new, 1)

          # Seller commercial model: negotiate asking price toward the verified investor band
          # using comparables/speed-price tradeoff, never fake pressure/buyers/offers.
          needle = """        if ($asking !== null && $investorMax !== null && $asking <= $investorMax) {
          """
          insert = """        if ($asking !== null && $investorMax !== null && $asking > $investorMax) {
                      return [
                          'negotiate_to_investor_range',
                          'Satıcıya piyasa, hızlı satış ve yatırımcı alım aralığını şeffaf biçimde ayır. Yatırımcıya sunulabilir gerçek bir fırsat oluşturmak için fiyatın yatırımcı alım bandına yaklaşması gerektiğini emsal ve hız/fiyat dengesiyle anlat; makul bir karşı teklif aralığı öner ve pazarlık esnekliğini ölç. Aciliyet üzerinden baskı kurma, sahte alıcı/teklif kullanma.',
                      ];
                  }

          """
          if needle not in s:
              raise SystemExit('seller investor-band insertion point not found')
          s = s.replace(needle, insert + needle, 1)
          p.write_text(s)

          # 2) Customer-facing prompt: concise qualification, media synthesis, commercial negotiation policy.
          p = Path('app/Services/RealEstateOpenAIService.php')
          s = p.read_text()
          needle = "- Müşterinin ne demek istediği belliyse gereksiz teyit isteme.\n"
          extra = """- Her turda tüm profil özetini tekrar etme. Yalnız yeni öğrenilen kritik bilgiyi gerekiyorsa tek cümlede teyit et ve ilerle.
          - Soru sormak için soru sorma: yalnız cevabı değerleme, eşleştirme veya pazarlık kararını gerçekten değiştirecekse sor.
          - Yatırımcıda bütçe + coğrafi esneklik/bölge + öncelikli taşınmaz türü + yatırım hedefi biliniyorsa sorgulamayı bırak ve fırsat/portföy değerlendirmesine geç. Finansman, m², hisseli tapu, altyapı, vade gibi ek kriterleri ancak müşteri kendiliğinden söylerse veya somut bir portföy kararında gerekli olursa sor.
          - 'Tüm Türkiye', 'bölge fark etmez', 'hepsi' gibi geniş tercihleri kabul et; müşteriyi zorla 2-3 il veya tek kategori seçmeye zorlama.
          """
          if extra not in s:
              if needle not in s:
                  raise SystemExit('conversation style insertion point not found')
              s = s.replace(needle, needle + extra, 1)

          old = """GÖRSEL VE BELGE KURALI
          Konuşma geçmişinde sadece [Fotoğraf], [Belge], [Video] veya benzeri bir yer tutucu görüyorsan içeriği gerçekten görmüş gibi davranma. Görsel/belge içeriği modele aktarılmamışsa açıkça ilgili kritik bilgiyi metin olarak iste. Asla 'tapuyu inceledim' gibi yanlış bir iddia kurma.

          PAZARLIK
          - Satıcı ve yatırımcı arasındaki farkı koru.
          - İlk teklif, karşı teklif ve kapanış stratejisi önerebilirsin.
          - Gerçek dışı baskı, sahte alıcı, sahte teklif, sahte aciliyet veya kandırma taktiği kullanma.
          - 'Kesin satar', 'kesin değerlenir', 'kesin kazandırır' deme.
          - Fiyatı mümkün olduğunca aralık olarak ve veri kalitesiyle birlikte düşün.
          """
          new = """GÖRSEL VE BELGE KURALI
          - [APPLICATION-GENERATED REAL ESTATE DATA] içinde recent_media_analysis varsa ilgili görsel/belge uygulama tarafından gerçekten analiz edilmiştir. Bu durumda 'fotoğraf bana görünmüyor' deme; analizde görülen bilgileri kullan ve resmi doğrulama olmadığını koru.
          - Müşteri art arda birden fazla fotoğraf/belge gönderirse her dosyaya ayrı ayrı cevap verme. Son medya analizlerini birlikte sentezleyip tek toplu cevap üret; aynı bilgiyi tekrar etme.
          - Yalnız konuşma geçmişinde [Fotoğraf]/[Belge]/[Video] yer tutucusu var ve recent_media_analysis yoksa içeriği görmüş gibi davranma; kritik bilgiyi metin olarak veya daha net görselle iste.
          - Asla yalnız görüntü analizine dayanarak 'tapu resmen doğrulandı', 'takyidat temiz' veya benzeri hukuki kesinlik kurma.

          PAZARLIK VE TİCARİ MODEL
          - Bu hat satıcıları gerçek yatırımcı/alıcılarla buluşturan aracılık modelidir; uygun işlemde aracı komisyonu doğabilir. Komisyon sorulursa gizleme, mevcut ticari şartlara göre şeffaf ol; oran uydurma.
          - Satıcı ve yatırımcı arasındaki bilgi sınırını koru. Satıcının gizli minimum fiyatını yatırımcıya açıklama.
          - Satıcı fiyatı yatırımcı alım bandının üzerindeyse pasif kalma: güncel emsal, hızlı satış ve yatırımcı alım aralığını ayrı ayrı kullanarak fiyat beklentisini profesyonelce aşağı yönlü yeniden çerçevele. Hedef, yatırımcıya gerçekten cazip ve işlem yapılabilir bir fiyat seviyesine yaklaşmaktır.
          - Fiyat indirimi için satıcının aciliyetini sömürme. 'Yatırımcı bu seviyede marj/risk görmüyor', 'hızlı satış için şu banda yaklaşmak gerekir' gibi veriye dayalı hız-fiyat dengesi anlat; makul karşı teklif aralığı öner ve esnekliği sor.
          - İlk teklif, karşı teklif ve kapanış stratejisi önerebilirsin; gerektiğinde fiyatı kademeli düşürmeye çalış ama sahte alıcı, sahte teklif, sahte aciliyet veya kandırma taktiği kullanma.
          - 'Kesin satar', 'kesin değerlenir', 'kesin kazandırır' deme.
          - Fiyatı mümkün olduğunca aralık olarak ve veri kalitesiyle birlikte düşün.
          """
          if old not in s:
              raise SystemExit('media/negotiation prompt block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 3) Update tests for intentional new semantics.
          p = Path('tests/Feature/RealEstateInvestorMandateIntelligenceTest.php')
          s = p.read_text()
          old = """        $this->assertSame(35, $summary['strength_score']);
                  $this->assertSame('building', $summary['status']);
                  $this->assertTrue($summary['core_ready']);
                  $this->assertSame(
                      'Yatırım hedefini: al-sat, kira getirisi veya değer artışı olarak netleştir.',
          """
          new = """        $this->assertSame(35, $summary['strength_score']);
                  $this->assertSame('building', $summary['status']);
                  $this->assertFalse($summary['core_ready']);
                  $this->assertSame(
                      'Yatırım hedefini kısa biçimde netleştir: al-sat, kira getirisi veya değer artışı.',
          """
          if old not in s:
              raise SystemExit('mandate test block not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/Feature/RealEstateProductionFlowTest.php')
          s = p.read_text()
          if 'use App\\Jobs\\ProcessRealEstateWhatsAppWebhook;' not in s:
              s = s.replace(
                  'use App\\Jobs\\ProcessWhatsAppWebhook;\n',
                  'use App\\Jobs\\ProcessRealEstateWhatsAppWebhook;\nuse App\\Jobs\\ProcessWhatsAppWebhook;\n',
                  1,
              )
          s = s.replace(
              'Queue::assertPushed(ProcessWhatsAppWebhook::class);',
              'Queue::assertPushed(ProcessRealEstateWhatsAppWebhook::class);',
              1,
          )
          p.write_text(s)

          # Self-delete: final branch/main tree contains no temporary workflow.
          Path('.github/workflows/apply-real-estate-final.yml').unlink()
          PY

      - name: Syntax check changed PHP files
        run: |
          php -l app/Services/RealEstateDecisionService.php
          php -l app/Services/RealEstateOpenAIService.php
          php -l tests/Feature/RealEstateInvestorMandateIntelligenceTest.php
          php -l tests/Feature/RealEstateProductionFlowTest.php

      - name: Commit patch back to branch
        run: |
          git config user.name "asilkangrup"
          git config user.email "asilkangrup@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finalize isolated real-estate media batching and negotiation UX"
          git push origin HEAD:fix/real-estate-media-batch-final
