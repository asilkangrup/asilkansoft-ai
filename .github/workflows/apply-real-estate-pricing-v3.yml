name: Apply Real Estate Pricing V3

on:
  push:
    branches:
      - fix/real-estate-pricing-v3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/real-estate-pricing-v3
          fetch-depth: 0

      - name: Apply isolated pricing patch
        run: python3 .github/scripts/run_pricing_v3_compat.py

      - name: Commit product changes
        run: |
          git config user.name "asilkangrup"
          git config user.email "asilkangrup@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Use two-level customer pricing for real estate"
          git push origin fix/real-estate-pricing-v3
