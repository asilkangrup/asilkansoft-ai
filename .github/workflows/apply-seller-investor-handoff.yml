name: Apply Seller Investor Handoff

on:
  push:
    branches:
      - feat/seller-investor-handoff

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/seller-investor-handoff
          fetch-depth: 0
      - name: Apply integration patch
        run: python3 scripts/apply_seller_investor_handoff.py
      - name: Syntax check changed PHP
        run: |
          php -l app/Services/RealEstateSellerInvestorHandoffService.php
          php -l app/Services/RealEstateOperatorAlertService.php
          php -l app/Observers/RealEstateProfileObserver.php
          php -l app/Services/RealEstateReadinessService.php
          php -l app/Console/Commands/InspectRealEstateInvestorHandoffs.php
          php -l tests/Feature/RealEstateSellerInvestorHandoffTest.php
      - name: Commit integration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/Observers/RealEstateProfileObserver.php app/Services/RealEstateOperatorAlertService.php app/Services/RealEstateReadinessService.php
          git commit -m "Integrate seller investor handoff runtime"
          git push origin HEAD:feat/seller-investor-handoff
