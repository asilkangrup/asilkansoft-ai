name: Apply Seller Price Answer Format

on:
  push:
    branches:
      - fix/seller-price-answer-format

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/seller-price-answer-format
          fetch-depth: 0

      - name: Apply concise seller price answer
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/Services/RealEstateOpenAIService.php')
          s = p.read_text()
          old = '''- "Gerçekçi satış bandı" için quick_sale_min / quick_sale_max kullan.\n- "Yatırımcı / hızlı nakit alım" için investor_buy bandının alt tarafını esas al; satıcıya investor_buy_max değerini hedef satış fiyatı gibi öne çıkarma. Uygunsa tek yuvarlak hedef olarak investor_buy_min veya alt-orta seviyeyi "yaklaşık 3,0 M civarı" gibi doğal biçimde söyle.\n- Üç ayrı fiyat bandı çıkarma; müşteriye yalnız bu iki seviye yeterlidir.\n'''
          new = '''- Satıcı fiyat soruyorsa cevabı mümkün olduğunca kısa, net ve satış odaklı ver. Varsayılan sunum üç kısa satırı geçmesin.\n- "Gerçekçi satış fiyatı" için quick_sale_min / quick_sale_max bandının alt-orta tarafını esas al ve mümkünse tek yuvarlak rakam söyle. Örnek ton: "Gerçekçi satış fiyatı: yaklaşık 3.500.000 TL — bu seviyede satış mümkün ama biraz bekleyebilir." Aralık ancak veri belirsizliği gerçekten gerektiriyorsa ver.\n- "Hızlı nakit alım seviyesi" için investor_buy_min / investor_buy_max bandını kullan. Genişletmeden doğal bir aralık ver. Örnek ton: "Hızlı nakit alım seviyesi: yaklaşık 2.500.000–3.100.000 TL."\n- Ardından tek kapanış cümlesi kullan: "Acil nakde çevirmek isterseniz yatırımcılardan teklifleri toplayıp size iletebilirim." Kullanıcı istemeden ek soru, uzun ekspertiz uyarısı, ilan-stratejisi veya üçüncü fiyat bandı ekleme.\n- Dahili market_min / market_max alanlarını müşteriye gösterme.\n'''
          if old not in s:
              raise SystemExit('seller pricing prompt block not found')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/apply-seller-price-answer.yml').unlink()
          PY

          php -l app/Services/RealEstateOpenAIService.php
          git config user.name "asilkangrup"
          git config user.email "asilkangrup@gmail.com"
          git add -A
          git commit -m "Refine seller price answer format"
          git push origin fix/seller-price-answer-format
