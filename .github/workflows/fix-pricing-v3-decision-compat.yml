name: Fix Pricing V3 Decision Compatibility

on:
  push:
    branches:
      - fix/real-estate-pricing-v3

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/real-estate-pricing-v3
          fetch-depth: 0
      - name: Apply compatibility fix
        run: python3 .github/scripts/fix_pricing_v3_decision_compat.py
      - name: Commit fix
        run: |
          git config user.name "asilkangrup"
          git config user.email "asilkangrup@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Preserve pricing decision compatibility"
          git push origin fix/real-estate-pricing-v3
