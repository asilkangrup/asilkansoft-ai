name: Matbaa AI Validation

on:
  pull_request:
    paths:
      - 'app/Services/Printing/**'
      - 'app/Jobs/ProcessPrintingTextBurst.php'
      - 'app/Jobs/ProcessWhatsAppWebhook.php'
      - 'config/matbaa.php'
      - 'tests/Feature/Printing/**'
      - '.env.example'
  push:
    branches:
      - matbaa-ai
      - matbaa-whatsapp-live
      - matbaa-business-card-mockup
      - matbaa-card-pdf-preview-2
      - matbaa-v1-professional
    paths:
      - 'app/Services/Printing/**'
      - 'app/Jobs/ProcessPrintingTextBurst.php'
      - 'app/Jobs/ProcessWhatsAppWebhook.php'
      - 'config/matbaa.php'
      - 'tests/Feature/Printing/**'
      - '.env.example'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, gd, sqlite3, pdo_sqlite
          coverage: none

      - name: Install system PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Validate PHP syntax
        run: |
          php -l app/Services/Printing/PrintingProductCatalog.php
          php -l app/Services/Printing/PrintingIntentExtractor.php
          php -l app/Services/Printing/PrintingConversationService.php
          php -l app/Services/Printing/PrintingDesignBriefService.php
          php -l app/Services/Printing/PrintingArtworkClassifierService.php
          php -l app/Services/Printing/PrintingBusinessCardDesignService.php
          php -l app/Services/Printing/PrintingOpenAiService.php
          php -l app/Services/Printing/PrintingAssistantService.php
          php -l app/Services/Printing/PrintingBusinessCardMockupService.php
          php -l app/Services/Printing/PrintingPdfArtworkRenderer.php
          php -l app/Services/Printing/PrintingWhatsAppInboundService.php
          php -l app/Jobs/ProcessPrintingTextBurst.php
          php -l app/Jobs/ProcessWhatsAppWebhook.php

      - name: Run Matbaa tests
        env:
          MATBAA_AI_ENABLED: 'false'
        run: php artisan test tests/Feature/Printing
